name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AlcedoFramework.slnx

      - name: Build
        run: dotnet build AlcedoFramework.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AlcedoFramework.slnx --configuration Release --no-build
