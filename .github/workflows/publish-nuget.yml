name: Publish NuGet packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore AlcedoFramework.slnx

      - name: Build
        run: dotnet build AlcedoFramework.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AlcedoFramework.slnx --configuration Release --no-build

      - name: Pack source projects
        shell: bash
        run: |
          while IFS= read -r -d '' project; do
            dotnet pack "$project" \
              --configuration Release \
              --no-build \
              --no-restore \
              --output artifacts/packages
          done < <(find Src -name '*.csproj' -print0)

      - name: Publish to GitHub Packages
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
