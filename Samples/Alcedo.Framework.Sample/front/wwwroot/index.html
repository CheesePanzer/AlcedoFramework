<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Alcedo.Frontend.Sample</title>
    <base href="/"/>
    <link rel="preload" id="webassembly"/>
    <link rel="icon" type="image/svg+xml" href="_content/Alcedo.Frontend.Blazor/favicon.svg"/>
    <!-- must import mudblazor css -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet"/>
    <style>
        #app-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 1.5rem;
            background: #f5f5f5;
        }

        #app-loading .brand {
            font-family: sans-serif;
            font-size: 2rem;
            color: #594ae2;
            letter-spacing: 0.15em;
        }

        #app-loading .bar-track {
            width: 320px;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
        }

        #app-loading .bar-fill {
            height: 100%;
            background: #594ae2;
            width: calc(var(--blazor-load-percentage, 0) * 1%);
            transition: width 0.05s ease-in-out;
        }
    </style>
    <script type="importmap"></script>
</head>

<body>
<div id="app">
    <div id="app-loading">
        <div class="brand">Alcedo Atthis</div>
        <div class="bar-track">
            <div class="bar-fill"></div>
        </div>
    </div>
</div>

<div id="blazor-error-ui">
    An unhandled error has occurred.
    <a href="." class="reload">Reload</a>
    <span class="dismiss">🗙</span>
</div>
<script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
<!-- must import mudblazor js -->
<script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
