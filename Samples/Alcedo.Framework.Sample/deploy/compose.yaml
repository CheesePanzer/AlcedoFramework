name: alcedo-framework-sample

services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${SAMPLE_DATABASE}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8.8.1
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  seaweedfs:
    image: chrislusf/seaweedfs:4.40
    restart: unless-stopped
    command: >-
      server
      -dir=/data
      -s3
      -volume.max=100
      -master.volumeSizeLimitMB=1024
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
      - "127.0.0.1:8888:8888"
    volumes:
      - seaweedfs-data:/data

  seaweedfs-admin:
    image: chrislusf/seaweedfs:4.40
    restart: unless-stopped
    command: admin -masters=seaweedfs:9333 -port=23646
    ports:
      - "127.0.0.1:23646:23646"
    depends_on:
      - seaweedfs

  back:
    build:
      context: ../../..
      dockerfile: Samples/Alcedo.Framework.Sample/back/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DataSourceOptions__Postgres: Host=postgres;Database=${SAMPLE_DATABASE};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      DataSourceOptions__Redis: redis:6379,password=${REDIS_PASSWORD},defaultDatabase=0
      JwtOptions__Key: ${SAMPLE_JWT_KEY}
      AlcedoColumnEncryptorOptions__Key: ${SAMPLE_ENCRYPTOR_KEY}
      AWS__ServiceURL: http://seaweedfs:8333
      AWS__ForcePathStyle: "true"
      AwsCredentials__AccessKey: ${SAMPLE_AWS_ACCESS_KEY}
      AwsCredentials__SecretKey: ${SAMPLE_AWS_SECRET_KEY}
      StorageOptions__S3PublicUrl: http://localhost:8333
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./back/appsettings.Production.json:/app/appsettings.Production.json:ro
      - back-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started

  front:
    build:
      context: ../../..
      dockerfile: Samples/Alcedo.Framework.Sample/front/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./front/appsettings.json:/usr/share/nginx/html/appsettings.json:ro
      - ./front/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - back

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
  back-logs:
